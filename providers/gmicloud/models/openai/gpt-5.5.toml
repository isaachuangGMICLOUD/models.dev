base_model = "openai/gpt-5.5"
# GMI's Responses endpoint sends reasoning effort as reasoning = { effort = "low" }.
reasoning_options = [{ type = "effort", values = ["none", "low", "medium", "high", "xhigh"] }]

[cost]
input = 5
output = 30
cache_read = 0.5

[[cost.tiers]]
tier = { type = "context", size = 272_000 }
input = 10
output = 45
cache_read = 1

[limit]
context = 1_050_000
