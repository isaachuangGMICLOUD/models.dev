# Sources verified 2026-09-17:
# Authenticated GET https://api.gmi-serving.com/v1/models:
# context_length=1048576; pricing.prompt=0.000000300,
# pricing.completion=0.000001200, pricing.input_cache_read=0.000000060.
# pricing.overrides[0]: min_prompt_tokens=512000, prompt=0.000000600,
# completion=0.000002400, input_cache_read=0.000000120.
# Costs below convert those per-token USD values to USD per million tokens.
# https://docs.gmicloud.ai/inference-engine/billing/price directs users to the live GMI rate card.
# Toggle: $.thinking.type = adaptive|disabled
# A GMI Chat Completions probe with reasoning_split=true returned 170 chars of
# reasoning_content for adaptive and omitted reasoning_content for disabled.
# Native wire docs: https://platform.minimax.io/docs/api-reference/text-openai-api
base_model = "minimax/MiniMax-M3"
reasoning_options = [{ type = "toggle" }]

[cost]
input = 0.3
output = 1.2
cache_read = 0.06

[[cost.tiers]]
tier = { type = "context", size = 512_000 }
input = 0.6
output = 2.4
cache_read = 0.12

[limit]
context = 1_048_576
